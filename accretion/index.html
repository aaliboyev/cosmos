<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACCRETION — the fish game, celestial edition</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #04050c; }
  body { font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif; color: #dfe3f0; }
  #disk { position: fixed; inset: 0; display: block; }

  .hud { position: fixed; z-index: 10; }
  .panel {
    background: rgba(10, 14, 26, .74); border: 1px solid rgba(160, 180, 255, .16);
    border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 5, .5);
  }
  .top { top: 18px; left: 18px; padding: 14px 18px 12px; max-width: 330px; }
  .top h1 { font-size: 15px; font-weight: 700; letter-spacing: .22em; }
  .top h1 span { color: #8fa8ff; }
  .top .line { margin-top: 6px; font-size: 12.5px; color: #9aa4c4; font-variant-numeric: tabular-nums; }
  .top .line b { color: #dfe3f0; font-weight: 600; }
  .stage { margin-top: 8px; font-size: 11px; letter-spacing: .16em; color: #8fa8ff; text-transform: uppercase; min-height: 28px; }

  .board { top: 18px; right: 18px; padding: 14px 18px; min-width: 190px; }
  .board h2 { font-size: 10.5px; letter-spacing: .22em; color: #9aa4c4; margin-bottom: 10px; }
  .board .row { display: flex; justify-content: space-between; gap: 14px; font-size: 12.5px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .board .row b { color: #dfe3f0; font-weight: 600; }
  .board .row span { color: #9aa4c4; }
  .board .row .crown { margin-right: 4px; }

  .controls {
    bottom: 18px; left: 50%; transform: translateX(-50%); padding: 13px 18px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 94vw;
  }
  .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 130px; }
  .ctl label { font-size: 11px; letter-spacing: .1em; color: #9aa4c4; display: flex; justify-content: space-between; }
  .ctl label output { color: #dfe3f0; font-variant-numeric: tabular-nums; }
  input[type="range"] { accent-color: #8fa8ff; cursor: pointer; }
  .speeds { display: flex; gap: 4px; }
  .speeds button {
    background: none; border: 1px solid rgba(160, 180, 255, .2); color: #9aa4c4; cursor: pointer;
    font-family: inherit; font-size: 11.5px; font-weight: 600; padding: 7px 12px; border-radius: 8px;
  }
  .speeds button.on { background: rgba(143, 168, 255, .18); color: #cdd8ff; border-color: rgba(143, 168, 255, .6); }
  .speeds button:focus-visible, button.restart:focus-visible { outline: 2px solid #8fa8ff; outline-offset: 2px; }
  button.restart {
    background: rgba(143, 168, 255, .16); border: 1px solid rgba(143, 168, 255, .5); color: #cdd8ff;
    font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 18px; border-radius: 10px; cursor: pointer;
  }
  .hint { bottom: 16px; left: 18px; font-size: 10.5px; color: #4c5578; }
  .credit { bottom: 16px; right: 18px; text-align: right; font-size: 10px; letter-spacing: .1em; color: #4c5578; text-transform: uppercase; line-height: 1.8; }
</style>
</head><body>

<canvas id="disk"></canvas>

<div class="hud top panel">
  <h1>A C C R E T I O N <span>·</span></h1>
  <div class="line">t ≈ <b id="time">0</b> · bodies <b id="count">0</b></div>
  <div class="line">biggest <b id="big">—</b></div>
  <div class="stage" id="stage">DUST SWARM · EVERYONE IS FOOD</div>
</div>

<div class="hud board panel">
  <h2>THE LOBBY — TOP 5</h2>
  <div id="rows"></div>
</div>

<div class="hud controls panel">
  <div class="ctl">
    <label>DISK HEAT <output id="heatOut">0.06</output></label>
    <input type="range" id="heat" min="1" max="20" value="6">
  </div>
  <div class="speeds" id="speeds"></div>
  <button class="restart" id="restart">↺ New disk</button>
</div>

<div class="hud hint">scroll to zoom · space to pause · the big eat faster — that's the whole law</div>
<div class="hud credit">gravitational focusing = the fish game<br>runaway growth is real astrophysics</div>

<script>
(function () {
'use strict';

// ---------- config
const N0 = 2600;
const GM = 40000;                 // star gravity
const GB = 0.9;                   // body-body gravity scale (oligarchs only)
const R_IN = 70, R_OUT = 270;     // disk annulus
const DT = 1 / 60;
const K_OLIG = 12;                // only the heaviest K pull on everyone (O(K·N))

let heat = 0.06;                  // initial velocity noise (disk temperature)
let speedIdx = 1;
const SPEEDS = [1, 4, 16];
let elapsed = 0, paused = false;

// ---------- bodies (struct of arrays; alive-compacted)
let n = 0;
const X = new Float32Array(N0), Y = new Float32Array(N0);
const VX = new Float32Array(N0), VY = new Float32Array(N0);
const M = new Float32Array(N0), R = new Float32Array(N0);

function radiusOf(m) { return Math.cbrt(m) * 1.1; }

function seed() {
  n = N0; elapsed = 0;
  for (let i = 0; i < N0; i++) {
    const a = R_IN + (R_OUT - R_IN) * Math.sqrt(Math.random());
    const th = Math.random() * Math.PI * 2;
    X[i] = Math.cos(th) * a; Y[i] = Math.sin(th) * a;
    const v = Math.sqrt(GM / a);
    // circular orbit + heat noise; everyone counterclockwise (the disk's inheritance)
    VX[i] = -Math.sin(th) * v * (1 + (Math.random() - .5) * heat * 2)
          + (Math.random() - .5) * v * heat;
    VY[i] = Math.cos(th) * v * (1 + (Math.random() - .5) * heat * 2)
          + (Math.random() - .5) * v * heat;
    M[i] = 0.6 + Math.random() * 1.6;
    R[i] = radiusOf(M[i]);
  }
}

function kill(i) { // swap-remove
  n--;
  X[i] = X[n]; Y[i] = Y[n]; VX[i] = VX[n]; VY[i] = VY[n]; M[i] = M[n]; R[i] = R[n];
}

// ---------- oligarchs: indices of the K most massive
let oligarchs = [];
function findOligarchs() {
  const idx = [];
  for (let i = 0; i < n; i++) idx.push(i);
  idx.sort((a, b) => M[b] - M[a]);
  oligarchs = idx.slice(0, Math.min(K_OLIG, n));
}

// ---------- physics
function step() {
  // star gravity on everyone + oligarch gravity (gap-clearing, scattering)
  for (let i = 0; i < n; i++) {
    const r2 = X[i] * X[i] + Y[i] * Y[i];
    const r = Math.sqrt(r2) + 1e-6;
    const a = -GM / (r2 + 40);
    let ax = a * X[i] / r, ay = a * Y[i] / r;
    for (const j of oligarchs) {
      if (j === i || j >= n) continue;
      const dx = X[j] - X[i], dy = Y[j] - Y[i];
      const d2 = dx * dx + dy * dy + 30;
      const d = Math.sqrt(d2);
      const g = GB * M[j] / d2;
      ax += g * dx / d; ay += g * dy / d;
    }
    VX[i] += ax * DT; VY[i] += ay * DT;
    X[i] += VX[i] * DT; Y[i] += VY[i] * DT;
  }
  // star swallows what falls too close; the void keeps what escapes too far
  for (let i = n - 1; i >= 0; i--) {
    const r2 = X[i] * X[i] + Y[i] * Y[i];
    if (r2 < 20 * 20 || r2 > 1200 * 1200) kill(i);
  }
  collide();
}

// spatial hash collisions with gravitational focusing
const grid = new Map();
function collide() {
  const CS = 14;
  grid.clear();
  for (let i = 0; i < n; i++) {
    const k = ((X[i] / CS) | 0) * 100003 + ((Y[i] / CS) | 0);
    let c = grid.get(k);
    if (!c) { c = []; grid.set(k, c); }
    c.push(i);
  }
  const dead = new Set();
  for (const [key, cell] of grid) {
    // gather this cell + right/down neighbors (avoid double checks)
    const cx = (key / 100003) | 0;
    for (const nk of [key, key + 1, key + 100003, key + 100004, key + 100002]) {
      const other = nk === key ? cell : grid.get(nk);
      if (!other) continue;
      for (let a = 0; a < cell.length; a++) {
        const i = cell[a];
        if (dead.has(i)) continue;
        const bStart = nk === key ? a + 1 : 0;
        for (let b = bStart; b < other.length; b++) {
          const j = other[b];
          if (i === j || dead.has(j) || dead.has(i)) continue;
          const dx = X[j] - X[i], dy = Y[j] - Y[i];
          const d2 = dx * dx + dy * dy;
          const sum = R[i] + R[j];
          // gravitational focusing: fat bodies pull food into their mouth —
          // effective cross-section grows with escape velocity vs relative speed
          const dvx = VX[j] - VX[i], dvy = VY[j] - VY[i];
          const vrel2 = dvx * dvx + dvy * dvy + 1;
          const focus2 = 1 + (2 * GB * (M[i] + M[j]) / sum) / vrel2;
          if (d2 < sum * sum * focus2) {
            // merge: momentum + mass conserved, winner takes the name
            const [w, l] = M[i] >= M[j] ? [i, j] : [j, i];
            const mt = M[w] + M[l];
            VX[w] = (VX[w] * M[w] + VX[l] * M[l]) / mt;
            VY[w] = (VY[w] * M[w] + VY[l] * M[l]) / mt;
            X[w] = (X[w] * M[w] + X[l] * M[l]) / mt;
            Y[w] = (Y[w] * M[w] + Y[l] * M[l]) / mt;
            M[w] = mt; R[w] = radiusOf(mt);
            dead.add(l);
          }
        }
      }
    }
  }
  // compact (indices shift, so re-find oligarchs after)
  const list = [...dead].sort((a, b) => b - a);
  for (const i of list) kill(i);
}

// ---------- render
const canvas = document.getElementById('disk');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, zoom = 1;
function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
}
addEventListener('resize', resize); resize();
addEventListener('wheel', e => {
  zoom = Math.min(3.5, Math.max(0.55, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
}, { passive: true });

const bgStars = [];
for (let i = 0; i < 260; i++) bgStars.push([Math.random(), Math.random(), Math.random() * .5 + .15]);

function draw() {
  ctx.fillStyle = '#04050c';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5a6488';
  for (const [sx, sy, sa] of bgStars) {
    ctx.globalAlpha = sa;
    ctx.fillRect(sx * W, sy * H, 1.4 * devicePixelRatio, 1.4 * devicePixelRatio);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  const s = zoom * devicePixelRatio * Math.min(W, H) / (620 * devicePixelRatio);
  ctx.scale(s, s);

  // the star
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 46);
  g.addColorStop(0, 'rgba(255,236,190,1)'); g.addColorStop(.35, 'rgba(255,180,80,.5)'); g.addColorStop(1, 'rgba(255,150,50,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill();

  const oligSet = new Set(oligarchs);
  for (let i = 0; i < n; i++) {
    const m = M[i];
    if (m > 400) {          // planet tier: warm, glowing
      const gg = ctx.createRadialGradient(X[i], Y[i], 0, X[i], Y[i], R[i] * 2.4);
      gg.addColorStop(0, 'rgba(255,200,140,.95)'); gg.addColorStop(.5, 'rgba(230,140,90,.5)'); gg.addColorStop(1, 'rgba(230,140,90,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(X[i], Y[i], R[i] * 2.4, 0, 7); ctx.fill();
    } else if (m > 60) {    // planetesimal tier
      ctx.fillStyle = oligSet.has(i) ? '#e8c9a0' : '#b8a88e';
      ctx.beginPath(); ctx.arc(X[i], Y[i], R[i], 0, 7); ctx.fill();
    } else {                // dust/pebbles
      ctx.fillStyle = 'rgba(150,168,220,.8)';
      ctx.fillRect(X[i] - R[i] / 2, Y[i] - R[i] / 2, R[i], R[i]);
    }
  }
  ctx.restore();
}

// ---------- UI
const timeEl = document.getElementById('time');
const countEl = document.getElementById('count');
const bigEl = document.getElementById('big');
const stageEl = document.getElementById('stage');
const rowsEl = document.getElementById('rows');
const speedsEl = document.getElementById('speeds');
SPEEDS.forEach((sp, i) => {
  const b = document.createElement('button');
  b.textContent = sp + '×';
  b.addEventListener('click', () => { speedIdx = i; syncSpeeds(); });
  speedsEl.appendChild(b);
});
function syncSpeeds() { [...speedsEl.children].forEach((b, i) => b.classList.toggle('on', i === speedIdx)); }
syncSpeeds();

const heatIn = document.getElementById('heat'), heatOut = document.getElementById('heatOut');
heatIn.addEventListener('input', () => { heat = heatIn.value / 100; heatOut.textContent = heat.toFixed(2); });
document.getElementById('restart').addEventListener('click', () => { seed(); findOligarchs(); });
addEventListener('keydown', e => { if (e.key === ' ') { paused = !paused; e.preventDefault(); } });

function stage() {
  if (n > 2000) return 'DUST SWARM · EVERYONE IS FOOD';
  if (n > 800) return 'PEBBLES STICKING · TWO BY TWO, YOUR INTUITION EXACTLY';
  if (n > 200) return 'PLANETESIMALS · THE LOBBY IS THINNING';
  if (n > 40) return 'RUNAWAY GROWTH · THE BIG EAT FASTER — THE FISH-GAME LAW';
  if (n > 12) return 'OLIGARCHS · CLEARING THEIR LANES';
  return 'A PLANETARY SYSTEM · LANES CLEARED, GAME OVER';
}

function updateHud() {
  timeEl.textContent = (elapsed * 2).toFixed(1) + ' Myr';
  countEl.textContent = n.toLocaleString('en-US');
  const sorted = [...oligarchs].filter(i => i < n).sort((a, b) => M[b] - M[a]).slice(0, 5);
  if (sorted.length) bigEl.textContent = (M[sorted[0]] / 500).toFixed(2) + ' M⊕';
  stageEl.textContent = stage();
  rowsEl.innerHTML = sorted.map((i, rank) =>
    '<div class="row"><b>' + (rank === 0 ? '<span class="crown">👑</span>' : '') + '#' + (rank + 1) + '</b>' +
    '<span>' + (M[i] / 500).toFixed(2) + ' M⊕ · r' + Math.round(Math.hypot(X[i], Y[i])) + '</span></div>'
  ).join('');
}

// ---------- loop
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) paused = true;
let frame = 0;
function loop() {
  requestAnimationFrame(loop);
  if (!paused) {
    const steps = SPEEDS[speedIdx];
    for (let s = 0; s < steps; s++) { step(); elapsed += DT; }
    if (frame % 20 === 0) findOligarchs();
    if (frame % 10 === 0) updateHud();
    frame++;
  }
  draw();
}
seed(); findOligarchs(); updateHud(); loop();
})();
</script>
</body></html>
